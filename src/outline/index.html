<!doctype html>
<html>
  <head>
    <style>
      p {
        border: 2px solid black;
        outline: 10px solid green;
        outline-offset: 15px;
        margin: 50px;
        padding: 20px;
        text-align: center;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <h2>CSS Outline</h2>
    <p>
      This element has a 2px black border and a green outline with a width of
      10px.
    </p>
  </body>
</html>
