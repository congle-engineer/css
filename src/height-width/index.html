<!doctype html>
<html>
  <head>
    <style>
      div {
        height: 70px;
        width: 100%;
        border: 1px solid green;
        padding: 8px;
      }
      .div1 {
        max-width: 300px;
        padding: 10px;
        background-color: powderblue;
      }
      .div2 {
        width: 500px;
        padding: 10px;
        background-color: powderblue;
      }
    </style>
  </head>
  <body>
    <h2>CSS height and width properties</h2>
    <div>This div element has a height of 70px and a width of 100%.</div>

    <h2>Max-width vs. width of an element</h2>
    <div class="div1">This div element has a max-width of 500px</div>
    <br />
    <div class="div2">This div element has a width of 500px</div>
  </body>
</html>
